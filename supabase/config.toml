# Configuração usada pelo Supabase CLI ("supabase functions deploy").
# As funções são chamadas pelo site com a Publishable key, que não é um JWT,
# então a verificação de JWT do Supabase fica desligada. Cada função faz as próprias checagens.
project_id = "igksrbrohmeeezufjynv"

[functions.calcular-frete]
verify_jwt = false

[functions.criar-pedido]
verify_jwt = false

[functions.webhook-mercadopago]
verify_jwt = false
