<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8c2a4f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="data/produtos.js"></script>
  <script src="js/app.js"></script>
  <title>Catálogo · TatiFashion Modas</title>
</head>
<body>
  <div id="topo"></div>
  <main class="container">
    <div class="filtros">
      <div class="barra-busca">
        <input id="busca" type="search" placeholder="Buscar peça..." aria-label="Buscar peça">
        <select id="ordem" aria-label="Ordenar">
          <option value="">Ordenar</option>
          <option value="menor">Menor preço</option>
          <option value="maior">Maior preço</option>
          <option value="nome">A a Z</option>
        </select>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <p class="contagem" id="contagem"></p>
    <div class="grade" id="grade"></div>
    <p class="vazio" id="vazio" hidden>Nenhuma peça encontrada.</p>
    <div style="height:24px"></div>
  </main>
  <div id="rodape"></div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const { PRODUTOS, categorias, cardProduto, esc } = TF;
      const url = new URLSearchParams(location.search);
      let cat = url.get("categoria") || "";
      const busca = document.getElementById("busca"), ordem = document.getElementById("ordem");
      const semAcento = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

      function chips() {
        document.getElementById("chips").innerHTML = ["", ...categorias()].map((c) =>
          '<button class="chip' + (c === cat ? " ativo" : "") + '" data-cat="' + esc(c) + '">' + (c ? esc(c) : "Todos") + '</button>').join("");
      }
      function render() {
        const q = semAcento(busca.value.trim());
        let lista = PRODUTOS.filter((p) => (!cat || p.categoria === cat) && (!q || semAcento(p.nome + " " + p.categoria + " " + p.cores.join(" ")).includes(q)));
        if (ordem.value === "menor") lista.sort((a, b) => a.preco - b.preco);
        if (ordem.value === "maior") lista.sort((a, b) => b.preco - a.preco);
        if (ordem.value === "nome") lista.sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
        document.getElementById("grade").innerHTML = lista.map(cardProduto).join("");
        document.getElementById("vazio").hidden = lista.length > 0;
        document.getElementById("contagem").textContent = lista.length + (lista.length === 1 ? " peça" : " peças");
      }
      document.getElementById("chips").addEventListener("click", (e) => {
        const b = e.target.closest(".chip"); if (!b) return;
        cat = b.dataset.cat;
        history.replaceState(null, "", cat ? "?categoria=" + encodeURIComponent(cat) : location.pathname);
        chips(); render();
      });
      busca.addEventListener("input", render);
      ordem.addEventListener("change", render);
      if (location.hash === "#busca") busca.focus();
      chips(); render();
    });
  </script>
</body>
</html>
