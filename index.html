<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8c2a4f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="data/produtos.js"></script>
  <script src="js/app.js"></script>
  <title>TatiFashion Modas</title>
  <meta name="description" content="Moda feminina TatiFashion Modas: blusas, vestidos, saias e casacos.">
</head>
<body>
  <div id="topo"></div>
  <main>
    <section class="hero">
      <div class="container">
        <h1>Moda feminina com o seu estilo</h1>
        <p>Blusas, vestidos, saias e casacos escolhidos com carinho pela Tati.</p>
        <a class="botao" href="catalogo.html">Ver coleção</a>
      </div>
    </section>
    <section class="secao">
      <div class="container">
        <div class="secao-topo"><h2>Categorias</h2></div>
        <div class="categorias" id="categorias"></div>
      </div>
    </section>
    <section class="secao" style="padding-top:0">
      <div class="container">
        <div class="secao-topo"><h2>Destaques</h2><a class="ver-tudo" href="catalogo.html">Ver tudo</a></div>
        <div class="grade" id="destaques"></div>
      </div>
    </section>
  </main>
  <div id="rodape"></div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const { PRODUTOS, categorias, cardProduto, esc } = TF;
      document.getElementById("categorias").innerHTML = categorias().map((c) => {
        const p = PRODUTOS.find((x) => x.categoria === c && x.destaque) || PRODUTOS.find((x) => x.categoria === c);
        return '<a class="categoria-card" href="catalogo.html?categoria=' + encodeURIComponent(c) + '"><img src="' + esc(p.foto) + '" alt="" loading="lazy"><span>' + esc(c) + '</span></a>';
      }).join("");
      document.getElementById("destaques").innerHTML = PRODUTOS.filter((p) => p.destaque).map(cardProduto).join("");
    });
  </script>
</body>
</html>
