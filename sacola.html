<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b0386a">
  <link rel="icon" href="img/flor.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="data/produtos.js"></script>
  <script src="js/app.js"></script>
  <title>Minha sacola · TatiFashion Modas</title>
</head>
<body>
  <div id="topo"></div>
  <main class="container" style="padding-bottom:32px">
    <h1 class="pagina-titulo">Minha sacola</h1>
    <div id="conteudo"></div>
  </main>
  <div id="rodape"></div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const { LOJA, esc, reais, Sacola, lerJSON, gravarJSON } = TF;
      const alvo = document.getElementById("conteudo");
      const ICONE_WHATS = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>';
      const dados = lerJSON("tf_comprador", {});
      let enviado = false;

      function montarMensagem(f) {
        const itens = Sacola.itens();
        const linhas = ["Olá! Gostaria de fazer este pedido pelo site da *TatiFashion Modas*:", ""];
        itens.forEach((i, n) => {
          const p = Sacola.produto(i.id);
          linhas.push((n + 1) + ") *" + p.nome + "*");
          linhas.push("   Tamanho: " + i.tamanho + " | Cor: " + i.cor);
          linhas.push("   " + i.qtd + " x " + reais(p.preco) + " = " + reais(i.qtd * p.preco));
          if (/^https?:/.test(location.protocol)) linhas.push("   " + new URL("produto.html?id=" + encodeURIComponent(p.id), location.href).href);
        });
        linhas.push("", "*Total: " + reais(Sacola.total()) + "* (" + Sacola.quantidade() + (Sacola.quantidade() === 1 ? " peça)" : " peças)"), "");
        linhas.push("*Nome:* " + f.nome);
        if (f.local) linhas.push("*Bairro/Cidade:* " + f.local);
        linhas.push("*Entrega:* " + f.entrega);
        if (f.obs) linhas.push("*Observação:* " + f.obs);
        return linhas.join("\n");
      }

      function render() {
        const itens = Sacola.itens();
        if (!itens.length) {
          alvo.innerHTML = '<div class="vazio"><p>Sua sacola está vazia.</p><a class="botao" href="catalogo.html">Ver coleção</a></div>';
          return;
        }
        const lista = itens.map((i, n) => {
          const p = Sacola.produto(i.id);
          return '<div class="item">' +
            '<a href="produto.html?id=' + encodeURIComponent(p.id) + '"><img src="' + esc(p.foto) + '" alt="' + esc(p.nome) + '"></a>' +
            '<div class="item-info">' +
              '<span class="item-nome">' + esc(p.nome) + '</span>' +
              '<span class="item-var">Tam. ' + esc(i.tamanho) + ' · ' + esc(i.cor) + '</span>' +
              '<span class="preco" style="font-size:.95rem;padding:2px 0 6px">' + reais(p.preco * i.qtd) + '</span>' +
              '<div class="item-rodape">' +
                '<div class="qtd"><button data-acao="menos" data-i="' + n + '" aria-label="Diminuir">−</button><span>' + i.qtd + '</span><button data-acao="mais" data-i="' + n + '" aria-label="Aumentar">+</button></div>' +
                '<button class="remover" data-acao="remover" data-i="' + n + '">Remover</button>' +
              '</div>' +
            '</div>' +
          '</div>';
        }).join("");
        const entrega = dados.entrega || "Combinar entrega";
        const radio = (v) => '<label class="radio"><input type="radio" name="entrega" value="' + v + '"' + (v === entrega ? " checked" : "") + '> ' + v + '</label>';

        alvo.innerHTML =
          '<div class="sacola-layout">' +
            '<div><div class="itens">' + lista + '</div>' +
            '<p style="margin:14px 0 0"><a class="ver-tudo" href="catalogo.html">+ Continuar comprando</a></p></div>' +
            '<div class="resumo">' +
              '<div class="resumo-linha"><span>Peças</span><span>' + Sacola.quantidade() + '</span></div>' +
              '<div class="resumo-linha resumo-total"><span>Total</span><span>' + reais(Sacola.total()) + '</span></div>' +
              '<p class="nota" style="text-align:left;margin:4px 0 0">Pagamento e entrega são combinados com a vendedora pelo WhatsApp.</p>' +
              '<form class="form" id="form" novalidate>' +
                '<div class="campo" id="campo-nome"><label for="nome">Seu nome *</label><input id="nome" autocomplete="name" value="' + esc(dados.nome || "") + '"><div class="msg-erro" id="erro-nome"></div></div>' +
                '<div class="campo"><label for="local">Bairro / cidade</label><input id="local" autocomplete="address-level2" value="' + esc(dados.local || "") + '"></div>' +
                '<div class="campo"><label>Como prefere receber?</label><div class="radios">' + radio("Combinar entrega") + radio("Retirar com a Tati") + radio("Pegar na feirinha / igreja") + '</div></div>' +
                '<div class="campo"><label for="obs">Observação</label><textarea id="obs" placeholder="Ex.: prefiro pagar no Pix">' + esc(dados.obs || "") + '</textarea></div>' +
                '<button class="botao whats largo" type="submit">' + ICONE_WHATS + ' Enviar pedido pelo WhatsApp</button>' +
                '<p class="nota">O WhatsApp vai abrir com a mensagem pronta. É só tocar em enviar.</p>' +
              '</form>' +
              (enviado ? '<div class="enviado"><p>Conseguiu enviar o pedido?</p><div class="acoes"><button class="botao" id="limpar">Sim, esvaziar sacola</button><button class="botao secundario" id="manter">Ainda não</button></div></div>' : '') +
            '</div>' +
          '</div>';
      }

      alvo.addEventListener("click", (e) => {
        const b = e.target.closest("[data-acao]");
        if (b) {
          const n = Number(b.dataset.i), item = Sacola.itens()[n];
          if (b.dataset.acao === "mais") Sacola.alterar(n, item.qtd + 1);
          if (b.dataset.acao === "menos") Sacola.alterar(n, item.qtd - 1);
          if (b.dataset.acao === "remover") Sacola.alterar(n, 0);
          guardarCampos(); render();
          return;
        }
        if (e.target.id === "limpar") { Sacola.limpar(); enviado = false; render(); TF.avisar("Obrigada pela compra! 💕"); }
        if (e.target.id === "manter") { enviado = false; guardarCampos(); render(); }
      });

      function guardarCampos() {
        const f = document.getElementById("form");
        if (!f) return;
        dados.nome = f.querySelector("#nome").value.trim();
        dados.local = f.querySelector("#local").value.trim();
        dados.obs = f.querySelector("#obs").value.trim();
        dados.entrega = (f.querySelector("input[name=entrega]:checked") || {}).value;
        gravarJSON("tf_comprador", { nome: dados.nome, local: dados.local, entrega: dados.entrega });
      }

      alvo.addEventListener("submit", (e) => {
        e.preventDefault();
        guardarCampos();
        if (!dados.nome) {
          document.getElementById("campo-nome").classList.add("erro");
          document.getElementById("erro-nome").textContent = "Informe seu nome para a vendedora saber quem é.";
          document.getElementById("nome").focus();
          return;
        }
        if (!LOJA.whatsapp) { TF.avisar("Número de WhatsApp da loja não configurado."); return; }
        const texto = montarMensagem(dados);
        const url = "https://wa.me/" + LOJA.whatsapp + "?text=" + encodeURIComponent(texto);
        window.open(url, "_blank") || (location.href = url);
        enviado = true; render();
      });

      render();
    });
  </script>
</body>
</html>
