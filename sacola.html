<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b0386a">
  <link rel="icon" href="img/flor.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="data/produtos.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <title>Minha sacola · TatiFashion Modas</title>
</head>
<body>
  <div id="topo"></div>
  <main class="container" style="padding-bottom:32px">
    <h1 class="pagina-titulo">Minha sacola</h1>
    <div id="conteudo"></div>
  </main>
  <div id="rodape"></div>
  <script>
    TF.pronto(() => {
      const { LOJA, esc, reais, Sacola, lerJSON, gravarJSON } = TF;
      const SUPA = window.SUPABASE || {};
      const alvo = document.getElementById("conteudo");
      const ICONE_WHATS = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>';
      const CORREIOS = "Receber pelos Correios";
      const ENTREGAS = [CORREIOS, "Retirar com a Tati", "Pegar na feirinha / igreja"];
      const CAMPOS = ["nome", "telefone", "email", "local", "obs", "cep", "rua", "numero", "complemento", "bairro", "cidade", "uf"];
      const dados = lerJSON("tf_comprador", {});
      if (!ENTREGAS.includes(dados.entrega)) dados.entrega = CORREIOS;
      // frete: { cep, assinatura, estado: "calculando" | "ok" | "erro", opcoes, escolhido, msg }
      let frete = { estado: null };
      let enviado = false;
      let numeroPedido = null;
      const CODIGO_ENTREGA = { [CORREIOS]: "correios", "Retirar com a Tati": "retirada", "Pegar na feirinha / igreja": "feirinha" };

      const soDigitos = (s) => String(s || "").replace(/\D/g, "");
      const assinatura = () => Sacola.itens().map((i) => i.id + ":" + i.qtd).join("|");
      const prazoTxt = (o) => o.prazo ? " · " + o.prazo + (o.prazo === 1 ? " dia útil" : " dias úteis") : "";
      const freteEscolhido = () => dados.entrega === CORREIOS && frete.estado === "ok" ? frete.opcoes.find((o) => o.servico === frete.escolhido) : null;
      const totalGeral = () => Sacola.total() + (freteEscolhido() ? freteEscolhido().valor : 0);

      function montarMensagem() {
        const itens = Sacola.itens();
        const linhas = ["Olá! Gostaria de fazer este pedido pelo site da *TatiFashion Modas*" + (numeroPedido ? " (pedido nº " + numeroPedido + ")" : "") + ":", ""];
        itens.forEach((i, n) => {
          const p = Sacola.produto(i.id);
          linhas.push((n + 1) + ") *" + p.nome + "*");
          linhas.push("   Tamanho: " + i.tamanho + " | Cor: " + i.cor);
          linhas.push("   " + i.qtd + " x " + reais(p.preco) + " = " + reais(i.qtd * p.preco));
          if (/^https?:/.test(location.protocol)) linhas.push("   " + new URL("produto.html?id=" + encodeURIComponent(p.id), location.href).href);
        });
        linhas.push("", "*Peças:* " + reais(Sacola.total()) + " (" + Sacola.quantidade() + (Sacola.quantidade() === 1 ? " peça)" : " peças)"));
        const f = freteEscolhido();
        if (dados.entrega === CORREIOS) {
          linhas.push("*Frete:* " + (f ? f.servico + (f.prazo ? " (" + f.prazo + (f.prazo === 1 ? " dia útil)" : " dias úteis)") : "") + ": " + (f.valor ? reais(f.valor) : "grátis") : "a combinar"));
        }
        linhas.push("*Total: " + reais(totalGeral()) + "*" + (dados.entrega === CORREIOS && !f ? " + frete" : ""), "");
        linhas.push("*Nome:* " + dados.nome);
        if (dados.telefone) linhas.push("*Telefone:* " + dados.telefone);
        linhas.push("*Entrega:* " + dados.entrega);
        if (dados.entrega === CORREIOS) {
          linhas.push("*Endereço:* " + dados.rua + ", " + dados.numero + (dados.complemento ? " - " + dados.complemento : ""));
          linhas.push("   " + dados.bairro + " - " + dados.cidade + "/" + dados.uf + " - CEP " + dados.cep);
        } else if (dados.local) {
          linhas.push("*Bairro/Cidade:* " + dados.local);
        }
        if (dados.obs) linhas.push("*Observação:* " + dados.obs);
        return linhas.join("\n");
      }

      const campo = (id, rotulo, extra = "") =>
        '<div class="campo" id="campo-' + id + '"><label for="' + id + '">' + rotulo + '</label><input id="' + id + '" value="' + esc(dados[id] || "") + '" ' + extra + '><div class="msg-erro" id="erro-' + id + '"></div></div>';

      function blocoFrete() {
        if (frete.estado === "calculando") return '<p class="nota" style="text-align:left">Calculando o frete…</p>';
        if (frete.estado === "erro") return '<p class="nota" style="text-align:left">' + esc(frete.msg) + '</p>';
        if (frete.estado !== "ok") return "";
        const opcoes = frete.opcoes.filter((o) => o.servico !== "Retirada");
        return '<div class="campo"><label>Frete</label><div class="radios">' + opcoes.map((o) =>
          '<label class="radio"><input type="radio" name="frete" value="' + esc(o.servico) + '"' + (o.servico === frete.escolhido ? " checked" : "") + '> ' +
          '<span style="flex:1">' + esc(o.servico) + '<small style="color:var(--texto-suave)">' + esc([o.prazo ? o.prazo + (o.prazo === 1 ? " dia útil" : " dias úteis") : "", o.nota || ""].filter(Boolean).join(" · ")) + '</small></span><b>' + (o.valor ? reais(o.valor) : "Grátis") + '</b></label>').join("") +
          '</div></div>';
      }

      function blocoEndereco() {
        if (dados.entrega !== CORREIOS) return campo("local", "Bairro / cidade", 'autocomplete="address-level2"');
        return '<div class="grade-campos">' +
          campo("cep", "CEP *", 'inputmode="numeric" autocomplete="postal-code" maxlength="9" placeholder="00000-000"') +
          '<div id="frete">' + blocoFrete() + '</div>' +
          campo("rua", "Rua *", 'autocomplete="address-line1"') +
          '<div class="duas-colunas">' + campo("numero", "Número *", 'inputmode="numeric"') + campo("complemento", "Complemento") + '</div>' +
          campo("bairro", "Bairro *") +
          '<div class="duas-colunas">' + campo("cidade", "Cidade *", 'autocomplete="address-level2"') + campo("uf", "UF *", 'maxlength="2" autocomplete="address-level1"') + '</div>' +
        '</div>';
      }

      function blocoResumo() {
        const f = freteEscolhido();
        return '<div class="resumo-linha"><span>Peças (' + Sacola.quantidade() + ')</span><span>' + reais(Sacola.total()) + '</span></div>' +
          (dados.entrega === CORREIOS ? '<div class="resumo-linha"><span>Frete</span><span>' + (f ? (f.valor ? reais(f.valor) : "Grátis") : "—") + '</span></div>' : "") +
          '<div class="resumo-linha resumo-total"><span>Total</span><span>' + reais(totalGeral()) + '</span></div>';
      }

      function render() {
        const itens = Sacola.itens();
        if (!itens.length) {
          alvo.innerHTML = '<div class="vazio"><p>Sua sacola está vazia.</p><a class="botao" href="catalogo.html">Ver coleção</a></div>';
          return;
        }
        const lista = itens.map((i, n) => {
          const p = Sacola.produto(i.id);
          return '<div class="item">' +
            '<a href="produto.html?id=' + encodeURIComponent(p.id) + '"><img src="' + esc(p.foto) + '"' + (p.fotoReserva ? ' data-reserva="' + esc(p.fotoReserva) + '"' : '') + ' alt="' + esc(p.nome) + '"></a>' +
            '<div class="item-info">' +
              '<span class="item-nome">' + esc(p.nome) + '</span>' +
              '<span class="item-var">Tam. ' + esc(i.tamanho) + ' · ' + esc(i.cor) + '</span>' +
              '<span class="preco" style="font-size:.95rem;padding:2px 0 6px">' + reais(p.preco * i.qtd) + '</span>' +
              '<div class="item-rodape">' +
                '<div class="qtd"><button data-acao="menos" data-i="' + n + '" aria-label="Diminuir">−</button><span>' + i.qtd + '</span><button data-acao="mais" data-i="' + n + '" aria-label="Aumentar">+</button></div>' +
                '<button class="remover" data-acao="remover" data-i="' + n + '">Remover</button>' +
              '</div>' +
            '</div>' +
          '</div>';
        }).join("");
        const radio = (v) => '<label class="radio"><input type="radio" name="entrega" value="' + v + '"' + (v === dados.entrega ? " checked" : "") + '> ' + v + '</label>';

        alvo.innerHTML =
          '<div class="sacola-layout">' +
            '<div><div class="itens">' + lista + '</div>' +
            '<p style="margin:14px 0 0"><a class="ver-tudo" href="catalogo.html">+ Continuar comprando</a></p></div>' +
            '<div class="resumo">' +
              '<div id="resumo">' + blocoResumo() + '</div>' +
              '<p class="nota" style="text-align:left;margin:4px 0 0">Pague no site com PIX, cartão (até 6x) ou boleto, ou combine com a vendedora pelo WhatsApp.</p>' +
              '<form class="form" id="form" novalidate>' +
                campo("nome", "Seu nome *", 'autocomplete="name"') +
                campo("telefone", "WhatsApp / telefone *", 'type="tel" inputmode="tel" autocomplete="tel" placeholder="(21) 99999-9999"') +
                campo("email", "E-mail (para o comprovante)", 'type="email" inputmode="email" autocomplete="email"') +
                '<div class="campo"><label>Como prefere receber?</label><div class="radios">' + ENTREGAS.map(radio).join("") + '</div></div>' +
                '<div id="endereco">' + blocoEndereco() + '</div>' +
                '<div class="campo"><label for="obs">Observação</label><textarea id="obs" placeholder="Ex.: prefiro pagar no Pix">' + esc(dados.obs || "") + '</textarea></div>' +
                (SUPA.url ? '<button class="botao largo" type="submit" data-canal="site" id="pagar">Pagar agora</button>' +
                '<p class="nota" style="margin-top:-6px">Você vai para a página segura do Mercado Pago.</p>' : '') +
                '<button class="botao whats largo' + (SUPA.url ? ' secundario-whats' : '') + '" type="submit" data-canal="whatsapp">' + ICONE_WHATS + ' Enviar pedido pelo WhatsApp</button>' +
                '<p class="nota">O WhatsApp vai abrir com a mensagem pronta. É só tocar em enviar.</p>' +
              '</form>' +
              (enviado ? '<div class="enviado"><p>Conseguiu enviar o pedido?</p><div class="acoes"><button class="botao" id="limpar">Sim, esvaziar sacola</button><button class="botao secundario" id="manter">Ainda não</button></div></div>' : '') +
            '</div>' +
          '</div>';
        if (dados.entrega === CORREIOS) verificarFrete();
      }

      const atualizarFrete = () => {
        const el = document.getElementById("frete"); if (el) el.innerHTML = blocoFrete();
        const r = document.getElementById("resumo"); if (r) r.innerHTML = blocoResumo();
      };

      function guardarCampos() {
        const f = document.getElementById("form");
        if (!f) return;
        CAMPOS.forEach((c) => { const el = f.querySelector("#" + c); if (el) dados[c] = el.value.trim(); });
        if (dados.uf) dados.uf = dados.uf.toUpperCase();
        dados.entrega = (f.querySelector("input[name=entrega]:checked") || {}).value || dados.entrega;
        const salvar = {}; ["nome", "telefone", "email", "local", "entrega", "cep", "rua", "numero", "complemento", "bairro", "cidade", "uf"].forEach((c) => (salvar[c] = dados[c]));
        gravarJSON("tf_comprador", salvar);
      }

      async function buscarEndereco(cep) {
        try {
          const r = await fetch("https://viacep.com.br/ws/" + cep + "/json/");
          const e = await r.json();
          if (e.erro) return false;
          const preencher = { rua: e.logradouro, bairro: e.bairro, cidade: e.localidade, uf: e.uf };
          Object.entries(preencher).forEach(([k, v]) => {
            const el = document.getElementById(k);
            if (el && v && !el.value.trim()) { el.value = v; dados[k] = v; }
          });
          guardarCampos();
          return true;
        } catch { return true; } // sem internet para o ViaCEP: deixa a cliente digitar
      }

      async function calcularFrete(cep) {
        const sig = assinatura();
        frete = { estado: "calculando", cep, sig };
        atualizarFrete();
        const anterior = lerJSON("tf_frete_escolhido", null);
        try {
          if (!SUPA.url) throw new Error("sem banco");
          const r = await fetch(SUPA.url + "/functions/v1/calcular-frete", {
            method: "POST",
            headers: { "Content-Type": "application/json", apikey: SUPA.chave },
            body: JSON.stringify({ cep, itens: Sacola.itens().map((i) => ({ id: i.id, qtd: i.qtd })) })
          });
          const d = await r.json().catch(() => ({}));
          if (frete.sig !== sig || frete.cep !== cep) return; // sacola ou CEP mudou no meio
          if (!r.ok || !d.opcoes) throw new Error(d.erro || "erro " + r.status);
          const correios = d.opcoes.filter((o) => o.servico !== "Retirada");
          if (!correios.length) throw new Error("sem opções");
          const escolhido = correios.some((o) => o.servico === anterior) ? anterior : correios[0].servico;
          frete = { estado: "ok", cep, sig, opcoes: d.opcoes, escolhido };
        } catch (e) {
          if (frete.sig !== sig || frete.cep !== cep) return;
          frete = { estado: "erro", cep, sig, msg: "Não conseguimos calcular o frete agora. Pode enviar o pedido: a Tati informa o valor pelo WhatsApp." };
        }
        atualizarFrete();
      }

      async function verificarFrete() {
        const cep = soDigitos(dados.cep);
        if (cep.length !== 8) { if (frete.estado) { frete = { estado: null }; atualizarFrete(); } return; }
        if (frete.cep === cep && frete.sig === assinatura() && frete.estado !== "erro") { atualizarFrete(); return; }
        const valido = await buscarEndereco(cep);
        if (!valido) {
          frete = { estado: "erro", cep, sig: assinatura(), msg: "CEP não encontrado. Confira os números." };
          atualizarFrete();
          return;
        }
        calcularFrete(cep);
      }

      alvo.addEventListener("click", (e) => {
        const b = e.target.closest("[data-acao]");
        if (b) {
          const n = Number(b.dataset.i), item = Sacola.itens()[n];
          const p = Sacola.produto(item.id);
          if (b.dataset.acao === "mais") {
            if (TF.estoque(p, item.tamanho, item.cor) <= item.qtd) { TF.avisar("Não há mais peças dessa combinação em estoque."); return; }
            Sacola.alterar(n, item.qtd + 1);
          }
          if (b.dataset.acao === "menos") Sacola.alterar(n, item.qtd - 1);
          if (b.dataset.acao === "remover") Sacola.alterar(n, 0);
          guardarCampos(); render();
          return;
        }
        if (e.target.id === "limpar") { Sacola.limpar(); enviado = false; frete = { estado: null }; render(); TF.avisar("Obrigada pela compra! 💕"); }
        if (e.target.id === "manter") { enviado = false; guardarCampos(); render(); }
      });

      alvo.addEventListener("change", (e) => {
        if (e.target.name === "entrega") {
          guardarCampos();
          document.getElementById("endereco").innerHTML = blocoEndereco();
          document.getElementById("resumo").innerHTML = blocoResumo();
          if (dados.entrega === CORREIOS) verificarFrete();
        }
        if (e.target.name === "frete") {
          frete.escolhido = e.target.value;
          gravarJSON("tf_frete_escolhido", frete.escolhido);
          document.getElementById("resumo").innerHTML = blocoResumo();
        }
      });

      alvo.addEventListener("input", (e) => {
        if (e.target.id !== "cep") return;
        const d = soDigitos(e.target.value).slice(0, 8);
        e.target.value = d.length > 5 ? d.slice(0, 5) + "-" + d.slice(5) : d;
        dados.cep = e.target.value;
        document.getElementById("campo-cep").classList.remove("erro");
        document.getElementById("erro-cep").textContent = "";
        if (d.length === 8) { guardarCampos(); verificarFrete(); }
      });

      function erro(id, msg) {
        document.getElementById("campo-" + id).classList.add("erro");
        document.getElementById("erro-" + id).textContent = msg;
        return id;
      }

      const corpoPedido = (canal) => ({
        canal,
        entrega: CODIGO_ENTREGA[dados.entrega],
        frete_servico: freteEscolhido() ? freteEscolhido().servico : null,
        cliente: { nome: dados.nome, telefone: dados.telefone, email: dados.email, observacao: dados.obs },
        endereco: dados.entrega === CORREIOS ? { cep: dados.cep, rua: dados.rua, numero: dados.numero, complemento: dados.complemento, bairro: dados.bairro, cidade: dados.cidade, uf: dados.uf } : {},
        itens: Sacola.itens().map((i) => ({ id: i.id, tamanho: i.tamanho, cor: i.cor, qtd: i.qtd }))
      });
      async function enviarPedido(canal, ms) {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), ms);
        try {
          const r = await fetch(SUPA.url + "/functions/v1/criar-pedido", {
            method: "POST", signal: ctrl.signal,
            headers: { "Content-Type": "application/json", apikey: SUPA.chave },
            body: JSON.stringify(corpoPedido(canal))
          });
          const d = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(d.erro || "Erro " + r.status);
          return d;
        } finally { clearTimeout(t); }
      }

      alvo.addEventListener("submit", async (e) => {
        e.preventDefault();
        const canal = (e.submitter && e.submitter.dataset.canal) || "whatsapp";
        guardarCampos();
        alvo.querySelectorAll(".campo.erro").forEach((c) => c.classList.remove("erro"));
        alvo.querySelectorAll(".msg-erro").forEach((c) => (c.textContent = ""));
        const faltando = [];
        if (!dados.nome) faltando.push(erro("nome", "Informe seu nome para a vendedora saber quem é."));
        if (canal === "site" && soDigitos(dados.telefone).length < 10) faltando.push(erro("telefone", "Informe o telefone com DDD."));
        if (dados.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(dados.email)) faltando.push(erro("email", "Confira o e-mail."));
        if (dados.entrega === CORREIOS) {
          if (soDigitos(dados.cep).length !== 8) faltando.push(erro("cep", "Informe o CEP com 8 números."));
          if (!dados.rua) faltando.push(erro("rua", "Informe a rua."));
          if (!dados.numero) faltando.push(erro("numero", "Informe o número (ou S/N)."));
          if (!dados.bairro) faltando.push(erro("bairro", "Informe o bairro."));
          if (!dados.cidade) faltando.push(erro("cidade", "Informe a cidade."));
          if (!/^[A-Z]{2}$/.test(dados.uf || "")) faltando.push(erro("uf", "UF com 2 letras."));
          if (!faltando.length && frete.estado === "calculando") { TF.avisar("Aguarde o cálculo do frete."); return; }
          if (!faltando.length && canal === "site" && !freteEscolhido()) { TF.avisar("Não conseguimos calcular o frete. Feche o pedido pelo WhatsApp."); return; }
        }
        if (faltando.length) { document.getElementById(faltando[0]).focus(); return; }

        const botoes = alvo.querySelectorAll("button[type=submit]");
        const original = e.submitter ? e.submitter.innerHTML : "";
        const travar = (sim, txt) => { botoes.forEach((b) => (b.disabled = sim)); if (e.submitter) e.submitter.innerHTML = sim ? txt : original; };

        if (canal === "site") {
          travar(true, "Abrindo o pagamento…");
          try {
            const d = await enviarPedido("site", 25000);
            gravarJSON("tf_ultimo_pedido", { pedido_id: d.pedido_id, numero: d.numero, total: d.total, em: Date.now() });
            location.href = d.pagar_url;
          } catch (err) {
            travar(false);
            TF.avisar(err.name === "AbortError" ? "O pagamento demorou para abrir. Tente de novo." : err.message);
          }
          return;
        }

        if (!LOJA.whatsapp) { TF.avisar("Número de WhatsApp da loja não configurado."); return; }
        // grava o pedido no banco para a Tati ver no painel (se falhar, manda o WhatsApp mesmo assim)
        numeroPedido = null;
        const janela = window.open("", "_blank");
        if (SUPA.url) {
          travar(true, "Preparando a mensagem…");
          try { numeroPedido = (await enviarPedido("whatsapp", 6000)).numero; } catch (err) { console.warn("Pedido não gravado no banco:", err); }
          travar(false);
        }
        const url = "https://wa.me/" + LOJA.whatsapp + "?text=" + encodeURIComponent(montarMensagem());
        if (janela && !janela.closed) janela.location.href = url; else location.href = url;
        enviado = true; render();
      });

      render();
    });
  </script>
</body>
</html>
