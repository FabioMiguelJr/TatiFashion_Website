<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8c2a4f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="data/produtos.js"></script>
  <script src="js/app.js"></script>
  <title>Produto · TatiFashion Modas</title>
</head>
<body>
  <div id="topo"></div>
  <main class="container" id="produto"></main>
  <div id="rodape"></div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const { PRODUTOS, esc, reais, cardProduto, avisar } = TF;
      const id = new URLSearchParams(location.search).get("id");
      const p = PRODUTOS.find((x) => x.id === id);
      const alvo = document.getElementById("produto");
      if (!p) {
        alvo.innerHTML = '<p class="vazio">Produto não encontrado.<br><br><a class="botao" href="catalogo.html">Ver catálogo</a></p>';
        return;
      }
      document.title = p.nome + " · TatiFashion Modas";
      const escolha = { tamanho: p.tamanhos.length === 1 ? p.tamanhos[0] : null, cor: p.cores.length === 1 ? p.cores[0] : null };
      const botoes = (lista, tipo) => lista.map((v) => '<button class="opcao-btn' + (escolha[tipo] === v ? " ativo" : "") + '" data-tipo="' + tipo + '" data-valor="' + esc(v) + '">' + esc(v) + '</button>').join("");
      const parcela = p.preco >= 60 ? '<p class="parcelas">ou 2x de ' + reais(p.preco / 2) + ' (combinado no WhatsApp)</p>' : '<p class="parcelas">Pagamento combinado pelo WhatsApp</p>';
      const relacionados = PRODUTOS.filter((x) => x.categoria === p.categoria && x.id !== p.id).slice(0, 4);

      alvo.innerHTML =
        '<div class="produto-layout">' +
          '<div class="produto-foto"><img src="' + esc(p.foto) + '" alt="' + esc(p.nome) + '"></div>' +
          '<div class="produto-detalhes">' +
            '<div class="migalha"><a href="catalogo.html">Catálogo</a> / <a href="catalogo.html?categoria=' + encodeURIComponent(p.categoria) + '">' + esc(p.categoria) + '</a></div>' +
            '<h1>' + esc(p.nome) + '</h1>' +
            '<div class="preco">' + (p.precoAntigo ? '<s>' + reais(p.precoAntigo) + '</s>' : '') + reais(p.preco) + '</div>' + parcela +
            '<div class="opcao"><div class="opcao-titulo">Tamanho</div><div class="opcoes" id="op-tamanho">' + botoes(p.tamanhos, "tamanho") + '</div></div>' +
            '<div class="opcao"><div class="opcao-titulo">Cor</div><div class="opcoes" id="op-cor">' + botoes(p.cores, "cor") + '</div></div>' +
            '<p class="descricao">' + esc(p.descricao) + '</p>' +
            '<div class="barra-compra"><div class="container"><button class="botao largo" id="comprar">Adicionar à sacola</button></div></div>' +
            '<div class="aviso" id="aviso"></div>' +
          '</div>' +
        '</div>' +
        (relacionados.length ? '<section class="secao"><div class="secao-topo"><h2>Você também pode gostar</h2></div><div class="grade">' + relacionados.map(cardProduto).join("") + '</div></section>' : '');

      alvo.addEventListener("click", (e) => {
        const b = e.target.closest(".opcao-btn"); if (!b) return;
        escolha[b.dataset.tipo] = b.dataset.valor;
        b.parentElement.querySelectorAll(".opcao-btn").forEach((x) => x.classList.toggle("ativo", x === b));
        document.getElementById("aviso").textContent = "";
      });
      document.getElementById("comprar").addEventListener("click", () => {
        if (!escolha.tamanho || !escolha.cor) {
          document.getElementById("aviso").textContent = "Escolha " + (!escolha.tamanho ? "o tamanho" : "a cor") + " antes de continuar.";
          return;
        }
        avisar("A sacola de compras chega na próxima etapa 🛍️");
      });
    });
  </script>
</body>
</html>
